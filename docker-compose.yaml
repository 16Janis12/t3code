version: '3.8'

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: t3code-tailscale
    hostname: t3code-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Optional: Port auf dem Host freigeben, falls auch lokaler Zugriff ohne Tailscale gewünscht ist:
    # ports:
    #   - "3773:3773"
    restart: unless-stopped

  t3code:
    build:
      context: .
      args:
        GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
    container_name: t3code-headless
    network_mode: "service:tailscale"
    environment:
      - T3CODE_HOST=0.0.0.0
      - GH_TOKEN=${GH_TOKEN:-${GITHUB_TOKEN:-}}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-T3 User}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-t3@example.com}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-${GIT_AUTHOR_NAME:-T3 User}}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-${GIT_AUTHOR_EMAIL:-t3@example.com}}
    volumes:
      # WICHTIG: ~/.t3 statt ~/.config/t3, damit SQLite-DB & Pairing erhalten bleiben
      - ./t3_data:/root/.t3
      - ./workspaces:/workspaces
    restart: unless-stopped
    depends_on:
      - tailscale

volumes:
  tailscale-state:
