name: Build Desktop Linux AppImage

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.0.41). Leave blank for auto-versioned release."
        required: false
        default: ""
        type: string

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  meta:
    name: Resolve Release Version & Tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p 'require("./apps/desktop/package.json").version.replace(/[-+].*$/, "")')"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_PATCH="$((PATCH + 1))"
          NEXT_BASE="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          INPUT_TAG="${{ inputs.tag_name }}"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
            VERSION="${TAG#v}"
            TITLE="T3 Code Desktop ${TAG}"
            if [[ "$VERSION" =~ - ]]; then
              IS_PRERELEASE="true"
              MAKE_LATEST="false"
            else
              IS_PRERELEASE="false"
              MAKE_LATEST="true"
            fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            TITLE="T3 Code Desktop ${TAG}"
            if [[ "$VERSION" =~ - ]]; then
              IS_PRERELEASE="true"
              MAKE_LATEST="false"
            else
              IS_PRERELEASE="false"
              MAKE_LATEST="true"
            fi
          else
            DATE_STAMP="$(date -u +%Y%m%d)"
            VERSION="${NEXT_BASE}-main.${DATE_STAMP}.${{ github.run_number }}"
            TAG="v${VERSION}"
            TITLE="T3 Code Desktop ${TAG}"
            IS_PRERELEASE="false"
            MAKE_LATEST="true"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"

          echo "Resolved version: ${VERSION}"
          echo "Resolved tag: ${TAG}"
          echo "Resolved title: ${TITLE}"
          echo "Is prerelease: ${IS_PRERELEASE}"
          echo "Make latest: ${MAKE_LATEST}"

  build:
    name: Build Linux AppImage (${{ matrix.arch }})
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=@16janis12/t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsecret-1-dev \
            pkg-config \
            imagemagick
          # Optional FUSE compatibility for AppImage tools
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Configure environment
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Desktop AppImage
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform linux \
            --target AppImage \
            --arch ${{ matrix.arch }} \
            --build-version "${{ needs.meta.outputs.version }}" \
            --verbose

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          for f in release/*.AppImage release/*.blockmap release/*.yml; do
            echo "Found artifact: $f"
            cp "$f" artifacts/
          done
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish AppImage to GitHub Releases
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: |
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.make_latest }}
          files: release-artifacts/*
          generate_release_notes: true
